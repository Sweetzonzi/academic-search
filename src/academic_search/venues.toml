# 来源命名空间自身的载体：由该来源入库的记录，其载体集合里自动含这些 id。
# arXiv 侧记录没有 `locations[]`，但「这篇挂在 arXiv 上」是明确事实，
# 少了这一条 `--venue arXiv` 永远命中不了 arXiv 记录。
[[source_carrier]]
source = "arxiv"
ids    = ["S4306400194"]
note   = "PLAN §2 的 ADR-0060 验收判据之一：`--venue arXiv --refresh false` 必须命中 > 0"
