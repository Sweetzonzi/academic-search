# 会名 / 载体名 → OpenAlex source id 的登记表（ADR-0060 决策 2）。
#
# 为什么在包内而不在 config/：config/ 是各人一份、不进版本库的用户配置；
# 而这张表每一条都要人工确认过——会议缩写不出现在载体名里，全称片段一次又返回
# 几十个候选，所以「会名 → S-id」不能靠字符串自动解析（见
# docs/实验/EX-2026-10-16-检索口径与来源校验.md §11(d)(e)）。
#
# 写 `S…` 作为会名是被允许的；那是未登记载体的逃生门（ADR-0060 决策 2）。
# 解析不到的名字**报错**，不静默失效。
#
# 载体类型不受限：下面既有会议 / 会议系列，也有期刊与仓库（arXiv）。
# 一个条目可以有多个 `ids`（远端一次请求用 `|` 连起来，OR 值 ≤ 100），
# 也可以有多个 `aliases`——配置里写哪个都行。**别登记覆盖残缺的实体**：
# ICML / ICLR 是已知例外（上游就是碎片，见各自的 note），其余登记项都先把
# `show` 的逐年覆盖看过再写进来。
#
# **查不到实体的载体登记不上**（实测见 EX-2026-10-16-source-contract §16(a)）：
#   AAMAS —— 会议在 OpenAlex 没有 source 实体（五种全称片段与缩写都返回 0 条，
#   AAMAS 2019 的 ACM 会议 DOI 直接 404）；唯一同名实体是期刊 S5405189，
#   把会议名映射到期刊会让名字与实体错位。画像里因此不写 AAMAS，靠关键词召回。
#
# ids 的确认路径：experiments/m1.5/26_venue_source_ids.py
# （`list` 列候选 → `show` 看逐年覆盖 → `count` 核当年作品数 → `work` 反查一篇论文的载体）。
# 数字与「哪些会登记不上」记在同份 EX 的 §16。

